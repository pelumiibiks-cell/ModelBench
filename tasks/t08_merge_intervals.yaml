id: t08_merge_intervals
category: standard
prompt: Write a function that takes a list of [start, end] interval pairs (inclusive) and merges all overlapping
  intervals, returning a sorted list of the merged, non-overlapping intervals.
entry_point: merge_intervals
reference_solution: "def merge_intervals(intervals):\n    if not intervals:\n        return []\n    ordered\
  \ = sorted(intervals, key=lambda iv: iv[0])\n    merged = [list(ordered[0])]\n    for start, end in\
  \ ordered[1:]:\n        last = merged[-1]\n        if start <= last[1]:\n            last[1] = max(last[1],\
  \ end)\n        else:\n            merged.append([start, end])\n    return merged\n"
test_code: "from solution import merge_intervals\n\ndef test_overlapping():\n    assert merge_intervals([[1,\
  \ 3], [2, 6], [8, 10]]) == [[1, 6], [8, 10]]\n\ndef test_touching():\n    assert merge_intervals([[1,\
  \ 4], [4, 5]]) == [[1, 5]]\n\ndef test_no_overlap():\n    assert merge_intervals([[1, 2], [5, 6]]) ==\
  \ [[1, 2], [5, 6]]\n\ndef test_unsorted_input():\n    assert merge_intervals([[5, 6], [1, 2]]) == [[1,\
  \ 2], [5, 6]]\n\ndef test_empty():\n    assert merge_intervals([]) == []\n"
timeout_s: 10.0
