id: a02_short_but_hard
category: adversarial_short_hard
prompt: Write a function next_permutation(nums) that rearranges a list of integers, in place, into the
  lexicographically next greater permutation. If no such permutation exists (the list is the highest possible
  permutation), rearrange it to the lowest possible order (sorted ascending). The function should return
  the list.
entry_point: next_permutation
reference_solution: "def next_permutation(nums):\n    n = len(nums)\n    i = n - 2\n    while i >= 0 and\
  \ nums[i] >= nums[i + 1]:\n        i -= 1\n    if i >= 0:\n        j = n - 1\n        while nums[j]\
  \ <= nums[i]:\n            j -= 1\n        nums[i], nums[j] = nums[j], nums[i]\n    nums[i + 1:] = reversed(nums[i\
  \ + 1:])\n    return nums\n"
test_code: "from solution import next_permutation\n\ndef test_middle_case():\n    assert next_permutation([1,\
  \ 2, 3]) == [1, 3, 2]\n\ndef test_descending_wraps_to_ascending():\n    assert next_permutation([3,\
  \ 2, 1]) == [1, 2, 3]\n\ndef test_single_swap_needed():\n    assert next_permutation([1, 1, 5]) == [1,\
  \ 5, 1]\n"
timeout_s: 10.0
