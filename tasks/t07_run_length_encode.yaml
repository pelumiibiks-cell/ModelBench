id: t07_run_length_encode
category: standard
prompt: 'Write a function that run-length-encodes a string: consecutive repeated characters become the
  character followed by its count (e.g. ''aaab'' -> ''a3b1''). A count of 1 is still written out explicitly.'
entry_point: run_length_encode
reference_solution: "def run_length_encode(s):\n    if not s:\n        return ''\n    result = []\n  \
  \  prev = s[0]\n    count = 1\n    for ch in s[1:]:\n        if ch == prev:\n            count += 1\n\
  \        else:\n            result.append(f'{prev}{count}')\n            prev = ch\n            count\
  \ = 1\n    result.append(f'{prev}{count}')\n    return ''.join(result)\n"
test_code: "from solution import run_length_encode\n\ndef test_basic():\n    assert run_length_encode('aaab')\
  \ == 'a3b1'\n\ndef test_no_repeats():\n    assert run_length_encode('abc') == 'a1b1c1'\n\ndef test_empty():\n\
  \    assert run_length_encode('') == ''\n\ndef test_single_run():\n    assert run_length_encode('aaaa')\
  \ == 'a4'\n"
timeout_s: 10.0
