id: t13_median_two_sorted
category: hard
prompt: Write a function that finds the median of two sorted lists of numbers combined, in O(log(min(m,
  n))) time (a binary-search partition approach, not simply merging and sorting).
entry_point: find_median_sorted_arrays
reference_solution: "def find_median_sorted_arrays(nums1, nums2):\n    if len(nums1) > len(nums2):\n \
  \       nums1, nums2 = nums2, nums1\n    m, n = len(nums1), len(nums2)\n    lo, hi = 0, m\n    half\
  \ = (m + n + 1) // 2\n    while lo <= hi:\n        i = (lo + hi) // 2\n        j = half - i\n      \
  \  left1 = nums1[i - 1] if i > 0 else float('-inf')\n        right1 = nums1[i] if i < m else float('inf')\n\
  \        left2 = nums2[j - 1] if j > 0 else float('-inf')\n        right2 = nums2[j] if j < n else float('inf')\n\
  \        if left1 <= right2 and left2 <= right1:\n            if (m + n) % 2 == 1:\n               \
  \ return max(left1, left2)\n            return (max(left1, left2) + min(right1, right2)) / 2\n     \
  \   elif left1 > right2:\n            hi = i - 1\n        else:\n            lo = i + 1\n    raise ValueError('input\
  \ arrays are not sorted')\n"
test_code: "from solution import find_median_sorted_arrays\n\ndef test_odd_total():\n    assert find_median_sorted_arrays([1,\
  \ 3], [2]) == 2\n\ndef test_even_total():\n    assert find_median_sorted_arrays([1, 2], [3, 4]) == 2.5\n\
  \ndef test_one_empty():\n    assert find_median_sorted_arrays([], [1]) == 1\n\ndef test_disjoint_ranges():\n\
  \    assert find_median_sorted_arrays([1, 2, 3], [4, 5, 6, 7]) == 4\n"
timeout_s: 10.0
