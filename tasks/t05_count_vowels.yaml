id: t05_count_vowels
category: trivial
prompt: Write a function that counts the number of vowels (a, e, i, o, u, case-insensitive) in a given
  string.
entry_point: count_vowels
reference_solution: "def count_vowels(s):\n    return sum(1 for ch in s.lower() if ch in 'aeiou')\n"
test_code: "from solution import count_vowels\n\ndef test_basic():\n    assert count_vowels('hello world')\
  \ == 3\n\ndef test_uppercase():\n    assert count_vowels('HELLO') == 2\n\ndef test_no_vowels():\n  \
  \  assert count_vowels('xyz') == 0\n"
timeout_s: 10.0
