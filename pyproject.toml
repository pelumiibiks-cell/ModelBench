[project]
name = "modelbench"
version = "0.1.0"
description = "A coding-task benchmark for Gemini models: deterministic pytest-graded tasks, cost/latency tracking, and a Monte Carlo-style scenario grid."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.20.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
modelbench = "modelbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["modelbench*"]
